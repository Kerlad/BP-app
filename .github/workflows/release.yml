name: release

# Builds the signed bundle of a release. It never uploads anything to Play Console: that is done by hand
# (docs/release-checklist.md). Run it for a tag `v1.0.0`, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit count below needs the whole history.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The upload key lives in the repository secrets, never in git (docs/11 §11.3):
      # BP_KEYSTORE_BASE64, BP_STORE_PASSWORD, BP_KEY_ALIAS, BP_KEY_PASSWORD.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.BP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "BP_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # versionCode only grows: the number of commits (docs/11 §11.4). versionName is the tag without `v`.
      - name: Version
        run: |
          echo "BP_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "BP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Check and build the bundle
        env:
          BP_STORE_PASSWORD: ${{ secrets.BP_STORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.BP_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.BP_KEY_PASSWORD }}
        run: ./gradlew verifyReleaseManifest bundleRelease

      # The mapping file turns the stack traces of Android vitals back into readable ones: keep it with the bundle.
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
