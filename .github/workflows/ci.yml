name: ci

on:
  pull_request:
  push:
  schedule:
    # The full emulator matrix every night (docs/10 §10.9).
    - cron: "0 2 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Static checks
        run: ./gradlew ktlintCheck detekt lintDebug
      - name: Unit tests
        run: ./gradlew test testDebugUnitTest
      - name: Build
        run: ./gradlew assembleDebug
      # The release build runs through R8 and its manifest must stay free of INTERNET (D-04) and a foreground service.
      - name: Release build and manifest
        run: ./gradlew assembleRelease verifyReleaseManifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/

  # End-to-end scenarios 1 and 2 of docs/10 §10.5 (scenario 3 runs among the unit tests).
  # A pull request is checked on API 33 only; pushes and the nightly run cover API 26, 33 and 36.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ github.event_name == 'pull_request' && fromJSON('[33]') || fromJSON('[26, 33, 36]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
